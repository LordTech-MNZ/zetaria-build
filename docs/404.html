  <p id="msg">Mensajería privada del Reino Soberano.</p>

  <a id="open" class="btn primary" href="#" hidden>Abrir en Zetaria</a>
  <a id="apk" class="btn ghost" href="https://github.com/lordtech-mnz/zetaria-build/releases/latest/download/Zetaria.apk">Descargar Zetaria (Android)</a>
  <button id="copy" class="btn ghost" type="button" hidden>Copiar enlace para pegarlo en Zetaria</button>

  <p id="help" class="small" hidden>
    ¿Aún no tienes Zetaria? Descárgala, instálala y vuelve a tocar este enlace.
    Los datos de la conexión van tras el símbolo # de la dirección: tu navegador no se los envía a GitHub.
  </p>
</main>

<script>
  // Si cambias el nombre del repositorio o usas un dominio propio, ajusta esta ruta base
  // (y ZETARIA_LINK_BASE en el workflow para que la app genere enlaces que apunten aquí).
  var BASE_PATH = "/zetaria-build";

  // La descarga apunta al repositorio de esta misma página (usuario.github.io/repositorio)
  if (/\.github\.io$/.test(location.hostname)) {
    document.getElementById("apk").href = "https://github.com/" + location.hostname.split(".")[0] + BASE_PATH +
      "/releases/latest/download/Zetaria.apk";
  }

  var path = location.pathname;
  if (path.indexOf(BASE_PATH) === 0) path = path.slice(BASE_PATH.length);
  path = path.replace(/^\/+/, "");
  if (path === "index.html" || path === "404.html") path = "";
  var hash = location.hash;
  // Formato nuevo:   /zetaria-build/#contact#/?v=...   (todo tras el primer #; la ruta es la raíz -> HTTP 200 -> vista previa)
  // Formato antiguo: /zetaria-build/contact#/?v=...    (ruta + #; se sigue aceptando)
  var rest = path.length ? path + hash : hash.replace(/^#/, "");
  var hasLink = rest.indexOf("#") > 0;

  if (hasLink) {
    var appUrl = "zetaria:/" + rest;
    var open = document.getElementById("open");
    open.href = appUrl;
    open.hidden = false;
    document.getElementById("copy").hidden = false;
    document.getElementById("help").hidden = false;
    document.getElementById("msg").textContent = "Fuiste invitado al Reino Soberano de Zetaria por medio de un enlace que conecta el mundo terrenal y virtual en uno solo, ingresa a mi app para ver el enlace del usuario o grupo";

    document.getElementById("copy").addEventListener("click", function () {
      var done = function () { document.getElementById("copy").textContent = "Enlace copiado"; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(location.href).then(done, function () { window.prompt("Copia este enlace:", location.href); });
      } else {
        window.prompt("Copia este enlace:", location.href);
      }
    });

    // Intento automático; si el navegador lo bloquea, queda el botón.
    setTimeout(function () { location.href = appUrl; }, 400);
  }
</script>
