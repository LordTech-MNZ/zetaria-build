name: Probar keystore

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar secrets de firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          B64=$(printf %s "$KEYSTORE_B64" | tr -d '[:space:]')
          PASS=$(printf %s "$KEYSTORE_PASS" | tr -d '[:space:]')
          echo "Largo de KEYSTORE_B64 (debe ser 5688): ${#B64}"
          echo "Largo de KEYSTORE_PASS (debe ser 24): ${#PASS}"
          printf %s "$B64" | base64 -d > t.jks 2>/dev/null || echo "KEYSTORE_B64 NO es base64 valido"
          echo "Huella del archivo (debe empezar por 209a84f3ff4fffed): $(sha256sum t.jks | cut -c1-16)"
          if keytool -list -keystore t.jks -storepass "$PASS" >/dev/null 2>&1; then
            echo "RESULTADO: OK, la keystore abre con esa contrasena"
          else
            echo "RESULTADO: FALLA, la contrasena o el archivo no coinciden"
            exit 1
          fi
