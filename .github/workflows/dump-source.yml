name: Exportar código de SimpleX (para revisión)

# No compila nada. Solo empaqueta los archivos .kt del tag elegido para poder leerlos
# y escribir funciones nuevas (como encuestas) sin adivinar.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de SimpleX (el mismo que usas para compilar)"
        default: "v7.0.3"
        required: true

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Código fuente de SimpleX
        uses: actions/checkout@v4
        with:
          repository: simplex-chat/simplex-chat
          ref: ${{ inputs.tag }}
          path: src

      - name: Empaquetar archivos Kotlin y textos base
        run: |
          cd src/apps/multiplatform/common/src
          find commonMain/kotlin androidMain/kotlin -name '*.kt' > /tmp/files.txt
          echo commonMain/resources/MR/base/strings.xml >> /tmp/files.txt
          echo "Archivos: $(wc -l < /tmp/files.txt)"
          mkdir -p /tmp/out
          zip -q /tmp/out/simplex-source.zip -@ < /tmp/files.txt
          # Módulo android (NtfManager, etc.) + lista de recursos (drawables, íconos): para revisar notificaciones
          cd ../../android/src/main
          find java -name '*.kt' > /tmp/files-android.txt
          find res -type f | sort > res-list.txt
          echo res-list.txt >> /tmp/files-android.txt
          echo "Archivos android: $(wc -l < /tmp/files-android.txt)"
          zip -q /tmp/out/simplex-android-source.zip -@ < /tmp/files-android.txt
          ls -la /tmp/out

      - uses: actions/upload-artifact@v4
        with:
          name: simplex-source
          path: /tmp/out/
          retention-days: 3
