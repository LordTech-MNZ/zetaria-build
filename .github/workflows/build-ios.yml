name: Zetaria iOS - rebrand e .ipa sin firmar

# ETAPA 1 (esta): aplica la marca Zetaria sobre el código iOS de SimpleX y sube el
# resultado como artefacto para que lo revises. NO compila, NO firma, NO publica nada.
#
# Aislado de Android a propósito:
#   - Solo se ejecuta a mano (workflow_dispatch); ningún push lo dispara.
#   - permissions: contents: read  -> no puede crear Releases ni tocar "latest",
#     que es lo que consulta el actualizador de la app de Android.
#   - Grupo de concurrencia propio (zetaria-ios), distinto de zetaria-build.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de SimpleX a usar como base (el mismo que en Android)"
        default: "v7.0.3"
        required: true
      build_ipa:
        description: "Además, intentar compilar un .ipa SIN FIRMAR (macOS, tarda; falla pronto si falta el núcleo de iOS)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zetaria-ios
  cancel-in-progress: true

jobs:
  rebrand-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Tu repo (branding + scripts)
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Código iOS de SimpleX en el tag elegido
        uses: actions/checkout@v4
        with:
          repository: simplex-chat/simplex-chat
          ref: ${{ inputs.tag }}
          path: src
          sparse-checkout: |
            apps/ios
            scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar marca Zetaria (iOS)
        env:
          # Opcional: tu Team ID de Apple (Settings > Secrets and variables > Actions > Variables).
          # Sin él, el rebrand avisa de que queda el Team ID de SimpleX.
          ZETARIA_APPLE_TEAM: ${{ vars.ZETARIA_APPLE_TEAM }}
        run: |
          pip install pillow
          test -d src/apps/ios || { echo "::error::No existe apps/ios en el tag ${{ inputs.tag }}"; exit 1; }
          python3 overlay/ios/ios_rebrand.py src/apps/ios overlay/.github/workflows/branding/zetaria_icon.png

      - name: ¿De dónde sale el núcleo nativo de iOS? (solo lectura)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p out
          {
            echo "== Carpeta apps/ios/Libraries =="
            ls -la src/apps/ios/Libraries 2>/dev/null || echo "(no existe)"
            echo
            echo "== Librerías que enlaza el proyecto Xcode =="
            grep -oE "lib[A-Za-z0-9_+-]*(simplex|HS)[A-Za-z0-9_.+-]*" src/apps/ios/SimpleX.xcodeproj/project.pbxproj | sort -u | head -40
            echo
            echo "== Scripts del repo que mencionan iOS =="
            ls src/scripts 2>/dev/null | head -50
            grep -rliE "ios" src/scripts 2>/dev/null | head -20
            echo
            for f in download-libs.sh prepare.sh prepare-x86_64.sh; do
              echo "== scripts/ios/$f =="
              head -n 80 "src/scripts/ios/$f" 2>/dev/null || echo "(no existe)"
              echo
            done
            echo "== Archivos de la Release oficial ${TAG} =="
            gh release view "$TAG" --repo simplex-chat/simplex-chat --json assets --jq '.assets[] | "\(.size)\t\(.name)"' 2>&1 | head -80
          } > out/zetaria-ios-core-check.txt 2>&1
          cat out/zetaria-ios-core-check.txt

      - name: Buscar el servidor de compilaciones del núcleo (solo lectura)
        # No modifica nada: lista proyectos/jobsets del servidor Hydra que usa SimpleX,
        # prueba las descargas posibles y lista el contenido del zip (así se ve la versión del núcleo).
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out
          {
            echo "== Dónde espera Xcode las librerías =="
            grep -nE "LIBRARY_SEARCH_PATHS|Libraries" src/apps/ios/SimpleX.xcodeproj/project.pbxproj | head -20
            echo
            python3 - <<'PY'
          import json, subprocess, urllib.request, urllib.parse

          HY = "https://ci.zw3rk.com"
          JOB = "aarch64-darwin.aarch64-darwin-ios:lib:simplex-chat"

          def get(path):
              req = urllib.request.Request(HY + path, headers={"Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def names(x):
              out = []
              for e in (x if isinstance(x, list) else list(x.keys()) if isinstance(x, dict) else []):
                  out.append(e if isinstance(e, str) else (e.get("name") or e.get("id") or str(e)[:60]))
              return out

          try:
              root = get("/")
          except Exception as e:
              print("No pude leer", HY, "->", e)
              raise SystemExit
          projs = names(root)
          print("== Proyectos en", HY, "==")
          print(", ".join(projs[:60]) or "(ninguno)")
          cands = []
          for pr in projs:
              if not any(k in pr.lower() for k in ("simplex", "zw3rk")):
                  continue
              try:
                  info = get("/project/" + urllib.parse.quote(pr))
              except Exception as e:
                  print("proyecto", pr, "-> error", e)
                  continue
              sets = names(info.get("jobsets", []))
              print("\n== Proyecto", pr, "| jobsets:", ", ".join(sets) or "(ninguno)")
              for js in sets:
                  cands.append((pr, js))

          print("\n== Probando descargas del núcleo de iOS ==")
          ok = []
          for pr, js in cands:
              url = f"{HY}/job/{pr}/{js}/{JOB}/latest/download/1"
              req = urllib.request.Request(url, method="HEAD")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      size = r.headers.get("Content-Length")
                      print(f"OK   {pr}/{js}  HTTP {r.status}  tamaño {size}")
                      ok.append((pr, js, url))
              except Exception as e:
                  print(f"NO   {pr}/{js}  {str(e)[:70]}")

          for pr, js, url in ok[:3]:
              print(f"\n== Contenido del zip de {pr}/{js} ==")
              subprocess.run(["curl", "-sSL", "--tlsv1.2", "-m", "600", "-o", "/tmp/core.zip", url])
              subprocess.run("unzip -l /tmp/core.zip | head -30", shell=True)
          PY
          } > out/zetaria-ios-hydra-check.txt 2>&1
          cat out/zetaria-ios-hydra-check.txt

      - name: Resumen de cambios
        if: always()
        run: |
          git -C src add -A
          git -C src diff --cached --stat | tail -40 || true
          mkdir -p out
          git -C src diff --cached --binary -- apps/ios > out/zetaria-ios-rebrand.patch || true
          cp -f src/apps/zetaria-ios-report.txt out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zetaria-ios-rebrand
          path: out/
          retention-days: 7

  # ------------------------------------------------------------------------------------
  # INTENTO de .ipa sin firmar. Solo corre si marcas "build_ipa" y si el rebrand salió OK.
  # No publica Releases (Android no se entera): deja el .ipa como artefacto descargable.
  # ------------------------------------------------------------------------------------
  build-ipa:
    if: ${{ inputs.build_ipa }}
    needs: rebrand-check
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Tu repo (branding + scripts)
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Código iOS de SimpleX en el tag elegido
        uses: actions/checkout@v4
        with:
          repository: simplex-chat/simplex-chat
          ref: ${{ inputs.tag }}
          path: src
          lfs: true
          sparse-checkout: |
            apps/ios
            scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar marca Zetaria (iOS)
        env:
          ZETARIA_APPLE_TEAM: ${{ vars.ZETARIA_APPLE_TEAM }}
        run: |
          pip install pillow
          python3 overlay/ios/ios_rebrand.py src/apps/ios overlay/.github/workflows/branding/zetaria_icon.png

      - name: Descargar el núcleo de iOS (script oficial de SimpleX)
        # Intento: el script se ejecuta sin argumentos. Si necesita alguno, su ayuda queda en el log.
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p out
          cd src
          echo "== contenido de scripts/ios/download-libs.sh =="
          sed -n 1,80p scripts/ios/download-libs.sh
          echo "== ejecutando =="
          bash scripts/ios/download-libs.sh 2>&1 | tee ../out/download-libs.log

      - name: Comprobar que el núcleo nativo (Haskell) está en el repo
        shell: bash
        run: |
          xcodebuild -version
          cd src/apps/ios
          echo "== Libraries =="; ls -la Libraries 2>/dev/null || echo "(no existe apps/ios/Libraries)"
          find . -name 'libHS*.a' -size +1M 2>/dev/null | head -5
          N=$(find . -name 'libHS*.a' -size +1M 2>/dev/null | wc -l | tr -d ' ')
          echo "Librerías del núcleo (libHS*.a) encontradas: $N"
          if [ "$N" -eq 0 ]; then
            echo "::error::Tras ejecutar download-libs.sh sigue sin haber librerías del núcleo (libHS*.a). Mira out/download-libs.log en el artefacto zetaria-ios-ipa."
            exit 1
          fi
          echo "== Proyectos y esquemas =="
          xcodebuild -list -project SimpleX.xcodeproj || true

      - name: Compilar sin firmar
        shell: bash
        run: |
          set -o pipefail
          cd src/apps/ios
          xcodebuild build \
            -project SimpleX.xcodeproj \
            -scheme "SimpleX (iOS)" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -n 60

      - name: Empaquetar .ipa sin firmar
        shell: bash
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "::error::No se generó ninguna .app"; exit 1; }
          echo "App: $APP"
          mkdir -p out ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../out/Zetaria-sin-firmar.ipa Payload)
          ls -la out

      - name: Variante pseudo-firmada con entitlements (opcional, para probar)
        # Sin firma, la app pierde sus entitlements (grupo de datos, llavero) y puede cerrarse al abrir.
        # Esto incrusta los entitlements con ldid; los instaladores como Sideloadly/AltStore la vuelven a firmar.
        continue-on-error: true
        shell: bash
        run: |
          brew install ldid
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)
          rm -rf ipa2 && mkdir -p ipa2/Payload && cp -R "$APP" ipa2/Payload/
          for B in ipa2/Payload/*.app ipa2/Payload/*.app/PlugIns/*.appex; do
            NAME=$(basename "$B")
            X=$(find "$RUNNER_TEMP/dd/Build/Intermediates.noindex" -name "${NAME}.xcent" | head -1)
            EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$B/Info.plist")
            if [ -n "$X" ]; then ldid -S"$X" "$B/$EXE" && echo "pseudo-firmado: $NAME"; else echo "sin .xcent para: $NAME"; fi
          done
          (cd ipa2 && zip -qry ../out/Zetaria-pseudofirmado.ipa Payload)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zetaria-ios-ipa
          path: |
            out/*.ipa
            out/*.log
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

